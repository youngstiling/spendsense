<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendSense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="logo">
          <span class="logo-icon">SS</span>
          <h1>SpendSense</h1>
        </div>
        <button type="button" class="btn btn-secondary" id="btn-import-csv">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Import CSV
        </button>
      </div>
      <p class="tagline">Track spending, spot patterns, stay on budget.</p>
      <p id="import-status" class="import-status hidden" role="status"></p>
    </div>
  </header>
  <input type="file" id="csv-input" accept=".csv,text/csv" hidden />

  <main class="main">
    <section id="summary" class="summary-cards" aria-label="Spending summary"></section>

    <div class="grid">
      <section class="panel">
        <h2>Add expense</h2>
        <form id="expense-form">
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Coffee, groceries, gas…" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="amount">Amount ($)</label>
              <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required />
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category" required></select>
            </div>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <button type="submit" class="btn btn-primary">Add expense</button>
        </form>
        <p class="import-hint">Or import a bank CSV from the header — columns: date, amount, description, category.</p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Recent expenses</h2>
          <select id="filter-category" class="filter-select" aria-label="Filter by category">
            <option value="all">All categories</option>
          </select>
        </div>
        <p id="empty-state" class="empty-state hidden">No expenses yet. Add your first one above.</p>
        <ul id="expense-list" class="expense-list"></ul>
      </section>
    </div>

    <section class="panel breakdown-panel">
      <h2>Spending by category</h2>
      <div id="category-breakdown" class="category-breakdown"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
